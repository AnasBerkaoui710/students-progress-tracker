
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Student Tracking</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <div class="logo">
            Smart Student Tracking
        </div>

        <nav>
            <a href="/">Dashboard</a>
            <a href="{{ url_for('students.students') }}">Students</a>
            <a href="{{ url_for('tracking.monthly_tracking') }}">Monthly Tracking</a>
        </nav>
    </header>

    <main>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        {% block content %}
        {% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>
</html>
